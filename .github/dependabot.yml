version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Matches min-release-age = 7 in the maintainer's ~/.npmrc.
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
  - package-ecosystem: gradle
    directory: /android
    # AGP 8.13 uses APIs removed in newer Gradle 9 releases.
    # Upgrade AGP and the wrapper together after an APK build check.
    ignore:
      - dependency-name: gradle
        update-types: [version-update:semver-major]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
